name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version label for this dry run. A dry run never publishes a release.
        default: 0.0.0-dryrun
      create_draft:
        description: Also upload everything to a draft release, which proves that GitHub accepts every file. Delete the draft afterwards.
        type: boolean
        default: false

permissions:
  contents: read

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  # A release builds only from a commit that passes every test on every platform.
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore XatLlmEngine.slnx --locked-mode
      - run: dotnet build XatLlmEngine.slnx --configuration Release --no-restore
      - run: dotnet test --solution XatLlmEngine.slnx --configuration Release --no-build

  changelog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check that CHANGELOG.md has a section for this version
        # A dry run has no CHANGELOG section, so it uses the Unreleased section.
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python build/release.py check-changelog --version "${VERSION#v}" --notes release-notes.md
          else
            python build/release.py check-changelog --notes release-notes.md
          fi
      - name: Check that every shipped package has its license texts
        run: python build/release.py check-notices
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7
          if-no-files-found: error

  package:
    needs: [test, changelog]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, rid: osx-arm64, extension: tar.gz, gpu_layers: '0' } # GitHub's macOS runners have no usable Metal GPU.
          - { os: ubuntu-24.04, rid: linux-x64, extension: tar.gz, gpu_layers: '' }
          - { os: windows-2025, rid: win-x64, extension: zip, gpu_layers: '' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check the version
        shell: bash
        run: |
          plain="${VERSION#v}"
          if ! [[ "$plain" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "'$VERSION' is not a valid version." >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$plain" >> "$GITHUB_ENV"
      - name: Restore the model from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: model-cache
          key: model-${{ hashFiles('build/model.lock.json') }}
      - name: Download the pinned model
        run: python build/release.py fetch-model --output model-cache
      - name: Build the package
        shell: bash
        run: python build/release.py package --rid "${{ matrix.rid }}" --version "$PACKAGE_VERSION" --output artifacts
      - name: Run the package with the real model
        shell: bash
        run: >
          python build/release.py smoke-test
          --rid "${{ matrix.rid }}"
          --package "artifacts/xat-llm-engine-$PACKAGE_VERSION-${{ matrix.rid }}.${{ matrix.extension }}"
          --model model-cache/Ministral-3-3B-Instruct-2512-Q4_K_M.gguf
          ${{ matrix.gpu_layers != '' && format('--gpu-layers {0}', matrix.gpu_layers) || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/xat-llm-engine-*.${{ matrix.extension }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Restore the model from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: model-cache
          key: model-${{ hashFiles('build/model.lock.json') }}
      - name: Add the model and its license
        run: |
          python build/release.py fetch-model --output model-cache
          # A link keeps the file in the cached folder, so the cache saved after this job is not empty.
          ln model-cache/Ministral-3-3B-Instruct-2512-Q4_K_M.gguf release/
          cp build/licenses/Ministral-LICENSE.txt release/
      - name: Check the size limit and write checksums
        run: python build/release.py finalize --folder release
      - name: Create the release
        if: github.event_name == 'push' || inputs.create_draft
        env:
          GH_TOKEN: ${{ github.token }}
          IS_TAG: ${{ github.event_name == 'push' }}
        run: |
          label="${VERSION}"
          flags=()
          if [ "$IS_TAG" = "true" ]; then
            flags+=(--verify-tag)
            case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          else
            label="dryrun-${VERSION}-${GITHUB_RUN_ID}"
            flags+=(--target "$GITHUB_SHA" --title "Dry run ${VERSION}")
          fi
          # The release stays a draft until the upload of every file is complete, so nobody can download a partial release.
          gh release create "$label" --draft --notes-file notes/release-notes.md "${flags[@]}"
          gh release upload "$label" release/*
          if [ "$IS_TAG" = "true" ]; then
            gh release edit "$label" --draft=false
          fi
